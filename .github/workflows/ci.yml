name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel any in-progress run for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Python Lint ─────────────────────────────────────────
  lint-python:
    name: "Lint — Python (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: pip install ruff

      - name: Run ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

  # ── Job 2: Schema Unit Tests ───────────────────────────────────
  test-schemas:
    name: "Test — Schema contracts (pytest)"
    runs-on: ubuntu-latest
    needs: lint-python  # only run tests if linting passes
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: pip install fastapi pydantic eval_type_backport uvicorn pytest pytest-asyncio httpx python-multipart python-dotenv

      - name: Run schema tests
        run: PYTHONPATH=".:services/backend-api:services/vision-ocr:services/entity-extraction:services/rag-service" python -m pytest schemas/tests/ services/backend-api/tests/ -v --tb=short

  # ── Job 3: Docker Build Smoke Test ────────────────────────────
  docker-build:
    name: "Build — Docker images (smoke test)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: vision-ocr
            dockerfile: services/vision-ocr/Dockerfile
            requirements: services/vision-ocr/requirements.txt
          - name: entity-extraction
            dockerfile: services/entity-extraction/Dockerfile
            requirements: services/entity-extraction/requirements.txt
          - name: rag-service
            dockerfile: services/rag-service/Dockerfile
            requirements: services/rag-service/requirements.txt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: mediscript-${{ matrix.service.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
